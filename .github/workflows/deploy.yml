name: Build & Deploy to Beget

# Собирает конфигуратор и заливает всю папку dist/ (index.html + хешированные js/css/glb)
# на хостинг Beget по FTP. Устаревшие файлы экшен удаляет сам через state-file sync.
# Доступы НЕ хранятся в коде — они берутся из Secrets репозитория (Settings → Secrets and
# variables → Actions). Нужны секреты: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR.

on:
  push:
    branches:
      - claude/3d-boiler-configurator-version2
  workflow_dispatch: {}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Папка на хостинге, например: /kotelgavno.ru/public_html/komplektacii3/
          # (путь должен заканчиваться слешем). Задаётся секретом FTP_SERVER_DIR.
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Заливаем весь dist: index.html + assets/ + models/ + .htaccess
          local-dir: ./dist/
          # FTPS (шифрование). Если хостинг ругается на сертификат — поменяйте на ftp.
          protocol: ftps

name: Build & Deploy to Beget

# Собирает конфигуратор и заливает один файл dist/index.html на хостинг Beget по FTP.
# Доступы НЕ хранятся в коде — они берутся из Secrets репозитория (Settings → Secrets and
# variables → Actions). Нужны секреты: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR.

on:
  push:
    branches:
      - claude/3d-boiler-configurator-version2
  workflow_dispatch: {}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      # Деплоим только самодостаточный index.html (модели/JS/CSS внутри него)
      - name: Prepare artifact
        run: |
          mkdir -p deploy
          cp dist/index.html deploy/index.html

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Папка на хостинге, например: /kotelgavno.ru/public_html/komplektacii2/
          # (путь должен заканчиваться слешем). Задаётся секретом FTP_SERVER_DIR.
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./deploy/
          # FTPS (шифрование). Если хостинг ругается на сертификат — поменяйте на ftp.
          protocol: ftps

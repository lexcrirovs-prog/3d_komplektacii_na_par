<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Конфигуратор парового котла</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      #error-display { display:none; position:fixed; inset:0; background:#1a1a2e; color:#ff6b6b; padding:40px; font-size:16px; white-space:pre-wrap; overflow:auto; z-index:9999; }
      #error-display.show { display:block; }
      #error-display h2 { color:#fff; margin-bottom:20px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-display"><h2>Error</h2><pre id="error-text"></pre></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('error-display');
        var txt = document.getElementById('error-text');
        el.className = 'show';
        txt.textContent += msg + '\n at line ' + line + ':' + col + '\n' + (err && err.stack ? err.stack : '') + '\n\n';
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('error-display');
        var txt = document.getElementById('error-text');
        el.className = 'show';
        txt.textContent += 'Unhandled Promise: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '\n\n';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
